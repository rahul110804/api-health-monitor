<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Health Monitor — Live Alerts</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f1117;
            color: #e0e0e0;
            min-height: 100vh;
        }

        header {
            background: #1a1d2e;
            padding: 20px 30px;
            border-bottom: 1px solid #2a2d3e;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .status-text {
            font-size: 13px;
            color: #22c55e;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #555;
        }

        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
        .empty-state p { font-size: 16px; }

        /* Toast popup */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 420px;
        }

        .toast {
            background: #1a1d2e;
            border: 1px solid #2a2d3e;
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            animation: slideIn 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .toast.latency { border-left: 4px solid #f59e0b; }
        .toast.error { border-left: 4px solid #ef4444; }

        @keyframes slideIn {
            from { transform: translateX(120%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes slideOut {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(120%); opacity: 0; }
        }

        .toast.hiding { animation: slideOut 0.3s ease forwards; }

        .toast-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .toast-emoji { font-size: 20px; }

        .toast-title {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
        }

        .toast-close {
            margin-left: auto;
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
        }

        .toast-meta {
            display: flex;
            gap: 16px;
            margin-bottom: 10px;
        }

        .toast-meta-item {
            font-size: 12px;
            color: #888;
        }

        .toast-meta-item span {
            color: #e0e0e0;
            font-weight: 500;
        }

        .toast-ai {
            font-size: 13px;
            color: #aaa;
            line-height: 1.5;
            border-top: 1px solid #2a2d3e;
            padding-top: 10px;
            margin-top: 4px;
        }

        .toast-ai strong { color: #818cf8; }

        .progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            background: #818cf8;
            animation: shrink 10s linear forwards;
        }

        @keyframes shrink {
            from { width: 100%; }
            to { width: 0%; }
        }

        /* Alert history cards */
        .alerts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .alerts-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .badge {
            background: #818cf8;
            color: white;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 20px;
        }

        .alert-card {
            background: #1a1d2e;
            border: 1px solid #2a2d3e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-card.latency { border-left: 4px solid #f59e0b; }
        .alert-card.error { border-left: 4px solid #ef4444; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
        }

        .card-time {
            font-size: 12px;
            color: #555;
        }

        .card-metrics {
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
        }

        .metric {
            font-size: 12px;
            color: #888;
        }

        .metric span {
            color: #e0e0e0;
            font-weight: 500;
        }

        .card-ai {
            font-size: 13px;
            color: #aaa;
            line-height: 1.6;
            background: #0f1117;
            padding: 12px;
            border-radius: 8px;
        }

        .card-ai strong { color: #818cf8; }

        .clear-btn {
            background: #2a2d3e;
            border: none;
            color: #aaa;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .clear-btn:hover { background: #3a3d4e; color: #fff; }
    </style>
</head>
<body>

<header>
    <div class="status-dot" id="statusDot"></div>
    <h1>API Health Monitor</h1>
    <span class="status-text" id="statusText">Connecting...</span>
</header>

<div class="toast-container" id="toastContainer"></div>

<div class="container">
    <div class="alerts-header">
        <h2>Live Alerts <span class="badge" id="alertCount">0</span></h2>
        <button class="clear-btn" onclick="clearAlerts()">Clear all</button>
    </div>

    <div id="alertList">
        <div class="empty-state">
            <div class="icon">🛡️</div>
            <p>All systems healthy. Alerts will appear here in real time.</p>
        </div>
    </div>
</div>

<script>
    let alertCount = 0;

    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const alertList = document.getElementById('alertList');
    const toastContainer = document.getElementById('toastContainer');
    const alertCountBadge = document.getElementById('alertCount');

    // connect to SSE stream
    const evtSource = new EventSource('/alerts/stream');

    evtSource.addEventListener('heartbeat', () => {
        statusDot.style.background = '#22c55e';
        statusText.textContent = 'Connected — watching for anomalies';
        statusText.style.color = '#22c55e';
    });

    evtSource.addEventListener('anomaly', (event) => {
        const anomaly = JSON.parse(event.data);
        showToast(anomaly);
        addAlertCard(anomaly);
        alertCount++;
        alertCountBadge.textContent = alertCount;
    });

    evtSource.onerror = () => {
        statusDot.style.background = '#ef4444';
        statusText.textContent = 'Disconnected — reconnecting...';
        statusText.style.color = '#ef4444';
    };

    function showToast(anomaly) {
        const isLatency = anomaly.type === 'HIGH_LATENCY';
        const emoji = isLatency ? '🐢' : '🔴';
        const title = isLatency ? 'High Latency Detected' : 'High Error Rate Detected';
        const metric = isLatency
            ? `p95 Latency: ${anomaly.observedValue}ms (threshold: ${anomaly.thresholdValue}ms)`
            : `Error Rate: ${anomaly.observedValue}% (threshold: ${anomaly.thresholdValue}%)`;

        const toast = document.createElement('div');
        toast.className = `toast ${isLatency ? 'latency' : 'error'}`;
        toast.innerHTML = `
            <div class="toast-header">
                <span class="toast-emoji">${emoji}</span>
                <span class="toast-title">${title}</span>
                <button class="toast-close" onclick="dismissToast(this.closest('.toast'))">×</button>
            </div>
            <div class="toast-meta">
                <div class="toast-meta-item">Endpoint: <span>${anomaly.httpMethod} ${anomaly.endpoint}</span></div>
                <div class="toast-meta-item">Metric: <span>${metric}</span></div>
            </div>
            <div class="toast-ai">
                <strong>AI Diagnosis:</strong> ${anomaly.aiExplanation}
            </div>
            <div class="progress-bar"></div>
        `;

        toastContainer.appendChild(toast);

        // auto dismiss after 10 seconds
        setTimeout(() => dismissToast(toast), 10000);
    }

    function dismissToast(toast) {
        if (!toast) return;
        toast.classList.add('hiding');
        setTimeout(() => toast.remove(), 300);
    }

    function addAlertCard(anomaly) {
        // remove empty state
        const emptyState = alertList.querySelector('.empty-state');
        if (emptyState) emptyState.remove();

        const isLatency = anomaly.type === 'HIGH_LATENCY';
        const emoji = isLatency ? '🐢' : '🔴';
        const title = isLatency ? 'High Latency Detected' : 'High Error Rate Detected';
        const metric = isLatency
            ? `${anomaly.observedValue}ms (threshold: ${anomaly.thresholdValue}ms)`
            : `${anomaly.observedValue}% (threshold: ${anomaly.thresholdValue}%)`;
        const metricLabel = isLatency ? 'p95 Latency' : 'Error Rate';
        const time = new Date().toLocaleTimeString();

        const card = document.createElement('div');
        card.className = `alert-card ${isLatency ? 'latency' : 'error'}`;
        card.innerHTML = `
            <div class="card-header">
                <div class="card-title">
                    <span>${emoji}</span>
                    <span>${title}</span>
                </div>
                <span class="card-time">${time}</span>
            </div>
            <div class="card-metrics">
                <div class="metric">Endpoint: <span>${anomaly.httpMethod} ${anomaly.endpoint}</span></div>
                <div class="metric">${metricLabel}: <span>${metric}</span></div>
            </div>
            <div class="card-ai">
                <strong>AI Diagnosis:</strong> ${anomaly.aiExplanation}
            </div>
        `;

        alertList.insertBefore(card, alertList.firstChild);
    }

    function clearAlerts() {
        alertList.innerHTML = `
            <div class="empty-state">
                <div class="icon">🛡️</div>
                <p>All systems healthy. Alerts will appear here in real time.</p>
            </div>
        `;
        alertCount = 0;
        alertCountBadge.textContent = 0;
    }
</script>

</body>
</html>
